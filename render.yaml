# Render Blueprint for Shopsoma staging
#
# Notes:
# - Staging/production should use object storage. Do not rely on local disk uploads.
# - Critical API flows currently run synchronously. Redis/Celery are not required for checkout,
#   payment verification, or webhook handling in the current codebase.
# - Redis/Celery env vars are listed as optional placeholders only for future worker adoption.

databases:
  - name: shopsoma-staging-db
    plan: basic-256mb
    region: oregon
    databaseName: shopsoma_staging
    user: shopsoma_user

services:
  - type: web
    name: shopsoma-staging-api
    env: python
    region: oregon
    plan: starter
    branch: develop
    buildCommand: "cd shopsoma-backend && pip install -r requirements.txt"
    startCommand: "cd shopsoma-backend && alembic upgrade heads && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: DATABASE_URL
        fromDatabase:
          name: shopsoma-staging-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_ECHO
        value: false
      - key: FRONTEND_BASE_URL
        value: https://shopsoma-staging.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://shopsoma-staging.onrender.com,http://localhost:5173,http://localhost:5174
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_REQUESTS
        value: 5
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: USE_LOCAL_STORAGE
        value: false
      - key: ALLOW_LOCAL_STORAGE_IN_NON_DEV
        value: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SHIPBUBBLE_API_KEY
        sync: false
      - key: SHIPBUBBLE_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: CDN_BASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false

  - type: web
    name: shopsoma-staging
    env: static
    branch: develop
    buildCommand: "cd shopsoma-frontend && npm install && npm run build"
    staticPublishPath: shopsoma-frontend/dist
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-store
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_BASE_URL
        value: https://shopsoma-staging-api.onrender.com/api/v1
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
